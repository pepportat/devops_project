name: Deploy to PythonAnywhere

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.PYTHONANYWHERE_PRIVATE_KEY }}

    - name: Run deploy script on PythonAnywhere
      run: |
        ssh YOUR_USERNAME@ssh.pythonanywhere.com 'bash /home/YOUR_USERNAME/my-ci-app/deploy.sh'
